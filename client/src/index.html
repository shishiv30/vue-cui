<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Property</title>
	<link rel="describedby" href="/llms.txt" />
	<link rel="preload" href="/index.min.css" as="style" />
	<link rel="stylesheet" href="/index.min.css" />
</head>
<body id="body">
	<script>
		var savedTheme = localStorage.getItem('theme');
		var themeClass = savedTheme === 'dark' ? 'theme-dark' : (savedTheme === 'light' ? 'theme-light' : '');
		if (themeClass) {
			document.documentElement.classList.add(themeClass);
			document.body.classList.add(themeClass);
		}
	</script>
	<div id="app"><!--app-html--></div>
	<script id="__INITIAL_STATE__" type="application/json"><!--app-state--></script>
	<script type="module" src="/client/src/main.ts"></script>
</body>
</html>
