services:
  pure-ui:
    image: pure
    build:
      context: .
      target: ${DOCKER_BUILD_TARGET:-production}
      args:
        PORT: ${PORT:-3000}
    ports:
      - "${DOCKER_PORT:-3002}:${PORT:-3000}"
    # Secrets are read from local env files at runtime only (never copied into the image).
    env_file:
      - path: .env
        required: false
      - path: .env.${NODE_ENV:-production}
        required: false
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DOCKER_PORT=${DOCKER_PORT}
      - CDN_HOST=${CDN_HOST}
      - APP_HOST=${APP_HOST:-${CDN_HOST}}
    volumes:
      - ./dist:/app/dist
    restart: unless-stopped